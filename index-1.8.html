    <script>
        // Permet de calculer la moyenne d'un tableau
        function ArrayAvg(myArray) {
            var i = 0, summ = 0, ArrayLen = myArray.length;
            while (i < ArrayLen) {
                summ = summ + parseInt(myArray[i++]);
        }
            return summ / ArrayLen;
        }

        var start_load_time = performance.now(); 
        var nbTest = parseInt(localStorage.getItem("nbTest1.8"));
        var result = localStorage.getItem("result1.8");

        if(!nbTest) {
            nbTest = 0;
            result = []
        } else {
            result = result.split(",")
        }

        window.onload = Pageloadtime;

        function Pageloadtime() {  
            var pgloadtime = performance.now() - start_load_time;
            result.push(pgloadtime);
            document.getElementById("temps").innerHTML = "Le temps de chargement de la page moyen est de " + parseFloat(ArrayAvg(result)).toFixed(2) + " secondes"; 

            if(nbTest === 100) {
                localStorage.setItem("nbTest1.8", null)
                localStorage.setItem("result1.8", null)
            } else {
                nbTest++;
                console.log(result, result.toString())
                localStorage.setItem("nbTest1.8", nbTest);
                localStorage.setItem("result1.8", result.toString());
                setTimeout(() => {
                    location.reload();
                }, 100)
            }
        }
    </script>
