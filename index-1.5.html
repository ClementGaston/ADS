        // Recupère un fichier et retourne le nombre d'octect obtenu
        async function getFile(url) {
            return new Promise(async (resolve, reject) => {
                let response = await fetch(url);
                const reader = response.body.getReader();

                let receivedLength = 0; 
                let chunks = []; 
                while(true) {
                    const {done, value} = await reader.read();

                    if (done) {
                        break;
                    }

                    chunks.push(value);
                    receivedLength += value.length;

                    console.log(`Received ${receivedLength}`);
                }
                resolve(receivedLength);
            })
        }

        // Permet de calculer la moyenne d'un tableau
        function ArrayAvg(myArray) {
            var i = 0, summ = 0, ArrayLen = myArray.length;
            while (i < ArrayLen) {
                summ = summ + myArray[i++];
        }
            return summ / ArrayLen;
        }

        function plot() {
            var trace1 = {
                x: Array.from(Array(photos.length).keys()),
                y: PNGSize,
                type: 'scatter',
                name: 'PNG'

            var trace2 = {

            var trace3 = {

            };

            // Plot les statistiques
            Plotly.newPlot('dotchart', [trace1, trace2, trace3]);

            var trace4 = {

            };

            Plotly.newPlot('histo', [trace4, trace5, trace6]);
            document.getElementById("gainJPG").textContent = `Gain PNG -> JPG : ${parseFloat(ArrayAvg(JPGGain)).toFixed(2)}%`
            document.getElementById("gainWEBP").textContent = `Gain PNG -> WEBP : ${parseFloat(ArrayAvg(WEBPGain)).toFixed(2)}%`
            document.getElementById("gainWEBP2").textContent = `Gain JPG -> WEBP : ${parseFloat(ArrayAvg(WEBPGain2)).toFixed(2)}%`
        }

        var PNGSize = [];

        var JPGGain = [];
        var WEBPGain = [];

        async function main() {
            for(let i = 0; i < photos.length; i++) {

                WEBPGain2[i] = ((JPGSize[i] - WEBPSize[i]) / JPGSize[i]) * 100;
