    <script>
        // Permet de calculer la moyenne d'un tableau
        function ArrayAvg(myArray) {
            var i = 0, summ = 0, ArrayLen = myArray.length;
            while (i < ArrayLen) {
                summ = summ + myArray[i++];
        }
            return summ / ArrayLen;
        }

        var start_load_time = performance.now();
        window.onload = Pageloadtime;

        function Pageloadtime() {  
            var pgloadtime = performance.now() - start_load_time;
            document.getElementById("temps").innerHTML = "Le temps de chargement de la page moyen est de " + parseFloat(pgloadtime).toFixed(2) + " secondes";
        }
    </script>
