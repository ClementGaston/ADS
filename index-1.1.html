        // Permet de calculer la moyenne d'un tableau
        function ArrayAvg(myArray) {
            var i = 0, summ = 0, ArrayLen = myArray.length;
            while (i < ArrayLen) {
                summ = summ + myArray[i++];
        }
            return summ / ArrayLen;
        }

        // Fonction pour plot l'histogramme

        // Recupère un fichier et retourne le nombre d'octect obtenu
        async function getFile(url) {
            return new Promise(async (resolve, reject) => {
                let response = await fetch(url);
                const reader = response.body.getReader();

                let receivedLength = 0; 
                let chunks = []; 
                while(true) {
                    const {done, value} = await reader.read();

                    if (done) {
                        break;
                    }

                    chunks.push(value);
                    receivedLength += value.length;

                    console.log(`Received ${receivedLength}`);
                }
                resolve(receivedLength);
            })
        }

        async function main() {
            let filesStat = [];
            let filesM = [];

            // Recupère chaque fichier
            for(let i = 0; i < files.length; i++) {
                console.log("File number :", i);
                let file, minFile;
                [file, minFile] = files[i];

                let x = await getFile(file);
                let y = await getFile(minFile);
                
                filesStat[i] = [x, y];
                filesM[i] = ((x - y) / x) * 100;
            }
            plot(filesM);

            document.getElementById("moyenneTailleGagne").textContent = `En moyenne, un fichier minifié pèse ${Math.round(ArrayAvg(filesM))}% de moins.`;
            
            filesStat.sort(function(a, b) {
                return a[0] - b[0];
            })

            var data = {
                x: filesStat.map(stat => stat[0]),
                y: filesStat.map(stat => stat[1]),
                type: 'scatter'
            };

            // Plot les statistiques
            Plotly.newPlot('dotchart', [data]);

            // Plot un courbe de temps gagnés en fonction des octets sauvé
