            var i = 0, summ = 0, ArrayLen = myArray.length;
            while (i < ArrayLen) {

        }

            ['https://raw.githubusercontent.com/Semantic-Org/Semantic-UI/master/dist/components/rating.js', 'https://raw.githubusercontent.com/Semantic-Org/Semantic-UI/master/dist/components/rating.min.js'],
        ];

        var xAsync = [];
        var xSync = [];
        var zAsync = [];
        var zSync = [];
        var y = [];
        var z = 1;
        const zMax = 50;

        function plot() {
            if(z < zMax) {
                zAsync[z - 1] = xAsync;
                zSync[z - 1] = xSync;
                z++;
                return loadScriptsAsync(1)
            }

            let finalXAsync = []
            let finalXSync = [];
            
            for(let i = 0; i < zMax; i++) {
                finalXAsync[i] = zAsync.map(val => val[i + 1]).reduce((a, b) => a + b, 0) / files.length
                finalXSync[i] = zSync.map(val => val[i + 1]).reduce((a, b) => a + b, 0) / files.length
            }
            console.log(finalXAsync, finalXSync)

            var trace1 = {
                x: Array.from(Array(zMax).keys()),
                y: finalXAsync,
                type: 'scatter',
                name: 'Async'
            };

            var trace2 = {
                x: Array.from(Array(zMax).keys()),
                y: finalXSync,
                type: 'scatter',
                name: 'Sync'
            };

            // Plot les statistiques
            Plotly.newPlot('dotchart', [trace1, trace2]);

            // Plot un courbe de temps gagnés en fonction des octets sauvé
            gainMoyen = Array.from(Array(zMax).keys()).map((_, i) => ((finalXSync[i] - finalXAsync[i]) / finalXSync[i]) * 100);
            var dataTime = {
                x: Array.from(Array(zMax).keys()),
                y: gainMoyen,
                type: 'scatter'
            };
            Plotly.newPlot('timechart', [dataTime]);
            document.getElementById("gain").textContent = `Le pourcentage de temps gagné en moyenne est de : ${ArrayAvg(gainMoyen)}%`
        }

        let nbFilesLoadedAsync = 0;
        let nbFilesLoadedSync = 0;

        async function nextScriptAsync(i, j, time) {
            nbFilesLoadedAsync++;
            console.log(nbFilesLoadedAsync, j);

            if(nbFilesLoadedAsync === i) {
                xAsync[i] = performance.now() - time;
                loadScriptsSync(i);
            }
        }

        async function nextScriptSync(i, j, time) {
            nbFilesLoadedSync++;
            console.log(nbFilesLoadedSync, j);

            if(nbFilesLoadedSync === i) {
                xSync[i] = performance.now() - time;

                if(i < 50) loadScriptsAsync(i + 1);
                else plot();
            }
        }

        async function loadedScriptAsync(i, j, time) {
            nextScriptAsync(i, j, time);
        }

        async function loadedScriptSync(i, j, time) {
            nextScriptSync(i, j, time);
        }

        async function loadScript(type, i, j, time) {
            if(type === "sync") console.log("Sync, File number :", j, "for ", i, "scripts, version", z);
            else console.log("Async, File number :", j, "for ", i, "scripts, version", z);
            let file;
            if(type === "sync") file = files[j][0] + "?n=sync" + j + "serie" + i + "version" + z;
            else file = files[j][0] + "?n=async" + j + "serie" + i + "version" + z;

            return new Promise((resolve, reject) => {
                // Ajout du script en sync
                var fileref = document.createElement('script')
                if(type === "sync") {
                    fileref.onload = () => {
                        loadedScriptSync(i, j, time);
                        resolve();
                    }
                } else {
                    fileref.onload = () => {
                        loadedScriptAsync(i, j, time);
                    }
                }
                if(type === "sync") fileref.setAttribute("async", false);
                fileref.setAttribute("type","text/javascript");
                fileref.setAttribute("src", file)
                if(type === "sync") document.getElementById("sync" + i).appendChild(fileref)
                else document.getElementById("async" + i).appendChild(fileref)
            })
        }

        function loadScriptsAsync(i) {
            nbFilesLoadedAsync = 0;
            let divAsync = document.createElement("div");
            divAsync.id = "async" + i
            document.body.appendChild(divAsync);

            let startSync = performance.now();
            for(let j = 0; j < i; j++) {
                loadScript("async", i, j, startSync)
            }
        }

        async function loadScriptsSync(i) {
            nbFilesLoadedSync = 0;
            let divSync = document.createElement("div");
            divSync.id = "sync" + i
            document.body.appendChild(divSync);

            let startSync = performance.now();
            for(let j = 0; j < i; j++) {
                await loadScript("sync", i, j, startSync)
            }
        }
        loadScriptsAsync(1)
    </script>
